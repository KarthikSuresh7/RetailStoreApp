spring:
  application:
    name: RetailsStoreApplication
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
resilience4j:
  retry:
    instances:
      paymentService:
        max-attempts: 3
        wait-duration: 2s
